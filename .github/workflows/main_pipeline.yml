# ═══════════════════════════════════════════════════════════════════
# GitHub Actions workflow — запускает main_pipeline.py АВТОМАТИЧЕСКИ, каждые
# 6 часов, на серверах GitHub (даже когда твой компьютер выключен).
#
# main_pipeline.py — ОТДЕЛЬНЫЙ от main.py/orchestrator.py пайплайн: собирает
# объявления (4 источника без логина) в одном из двух режимов — targeted
# (target_models.json) и/или broad (любые модели с hp<=160, см.
# broad_search_config.json) — переключается через SEARCH_MODE ниже; считает
# точную цену под ключ и публикует лидогенерирующий пост с CTA в @auto_generals.
#
# Как и в run_bot.yml (main.py): каждый запуск — на ЧИСТОЙ виртуальной
# машине, поэтому в конце прогона сохраняем обновлённый published_log.json
# (журнал "видели/публиковали", см. published_log.py) и лог обратно в
# репозиторий — иначе следующий запуск не будет "помнить", что уже
# опубликовано, и станет дублировать посты.
#
# Подробная инструкция по настройке (создание репозитория, GitHub Secrets,
# первый push) — в файле SETUP_GITHUB_ACTIONS.md.
# ═══════════════════════════════════════════════════════════════════

name: Main Pipeline (target_models.json)

on:
  # Расписание возобновлено 2026-07-06 после аудита стабилизации (см.
  # FINAL_STATE.md) — параллельный локальный+GHA прогон, из-за которого
  # раньше дублировались посты, теперь исключён правилом "всегда git pull
  # перед локальным запуском main_pipeline.py".
  schedule:
    # "0 */6 * * *" — в 00:00, 06:00, 12:00, 18:00 по UTC (у Казани UTC+3,
    # прибавляй 3 часа мысленно, чтобы понять "по-нашему").
    - cron: "0 */6 * * *"

  # Ручной запуск остаётся доступен — вкладка "Actions" -> "Main Pipeline
  # (target_models.json)" -> "Run workflow".
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-main-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать код проекта
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Установить браузеры Playwright (нужны kbchachacha/encar резолверу)
        run: python -m playwright install --with-deps chromium

      # ffmpeg — для video_generator.py (Ken Burns/титры/музыка, см. ТЗ
      # 2026-07-17). fonts-dejavu-core — шрифт с кириллицей и знаком ₽ для
      # титров (drawtext) — без него генерация видео на этой машине не
      # найдёт шрифт и просто пропустит видео (см. video_generator._find_fonts(),
      # не ломает публикацию текста/фото). ~6-7 мин на оба формата с
      # озвучкой (см. tts_generator.py — два вызова Claude API + edge-tts,
      # плюс более тяжёлая сборка вертикального формата с blur_pad;
      # уточнено 2026-07-17 по реальному замеру, раньше здесь была
      # оценка "~1-2 мин" без озвучки) — таймаут job'а не задан явно
      # (дефолт GitHub Actions 360 минут), с запасом хватает даже при
      # нескольких видео за прогон.
      - name: Установить ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Запустить main_pipeline
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          LOGISTICS_RUB: ${{ secrets.LOGISTICS_RUB }}
          BROKER_FEE_RUB: ${{ secrets.BROKER_FEE_RUB }}
          MARGIN_RUB: ${{ secrets.MARGIN_RUB }}
          BANK_COMMISSION_PCT: ${{ secrets.BANK_COMMISSION_PCT }}
          IMPORTER_TYPE: ${{ secrets.IMPORTER_TYPE }}
          LOG_FILE_PATH: logs/main_pipeline.log
          # VK — второй канал публикации (vk_publisher.py). Если секреты не
          # заданы в репозитории — просто пусто, публикация в VK молча
          # пропускается (см. vk_publisher.is_configured()), на Telegram
          # это никак не влияет.
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_OWNER_ID: ${{ secrets.VK_OWNER_ID }}
          # Claude API — для текста озвучки (tts_generator.py), актуально
          # только если VOICE_ENABLED=true ниже (без ключа TTS просто
          # пропускает голос с warning в лог, не ломает ролик).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Не секреты (режимы работы) — задаются прямо здесь, не через
          # GitHub Secrets. Поменяй на "targeted"/"broad", если нужно.
          SEARCH_MODE: both
          # Видео (video_generator.py) — ВЫКЛЮЧЕНО по умолчанию, пока не
          # подтверждена VK-видеозагрузка на сети GitHub Actions (см.
          # run_bot.yml: workflow_dispatch test_video — ручная проверка
          # ПЕРЕД включением здесь на постоянной основе, аудит 2026-07-17).
          # Включить: VIDEO_ENABLED: "true" — раз в VIDEO_EVERY_N_POSTS
          # постов (по умолчанию 3) генерируется и публикуется ролик в оба
          # канала; VOICE_ENABLED: "true" — тот же ролик с озвучкой.
          VIDEO_ENABLED: "false"
          VOICE_ENABLED: "false"
          VIDEO_EVERY_N_POSTS: "3"
          VIDEO_POST_MODE: "same"
        run: python main_pipeline.py

      - name: Проверить rejected_posts.log (гейт validate_post_before_publish)
        if: always()
        # Каждый прогон стартует на чистой машине — если файл появился и
        # не пуст, значит в ЭТОМ прогоне гейт (post_validator.py) кого-то
        # отклонил (нет фото / корейский текст в названии / год вне
        # диапазона). Явно фейлим job (exit 1), чтобы это было видно
        # красным крестиком в Actions, а не тихо терялось в логе.
        run: |
          if [ -s rejected_posts.log ]; then
            echo "::error::validate_post_before_publish() отклонил пост(ы) в этом прогоне:"
            cat rejected_posts.log
            exit 1
          fi
          echo "rejected_posts.log пуст — гейт ничего не отклонил в этом прогоне"

      - name: Сохранить журнал публикаций и лог
        if: always()  # сохраняем, даже если прогон упал — лог полезен для диагностики
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add published_log.json logs/main_pipeline.log target_models_cache.json video_state.json
          git diff --staged --quiet || git commit -m "Автообновление published_log.json [skip ci]"
          git push
