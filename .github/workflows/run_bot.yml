# ═══════════════════════════════════════════════════════════════════
# GitHub Actions workflow — запускает main.py АВТОМАТИЧЕСКИ, на серверах
# GitHub, даже когда твой компьютер выключен.
#
# Как это работает "на пальцах":
# GitHub предоставляет бесплатные виртуальные машины, на которых можно
# по расписанию (или вручную) запускать любые команды — в нашем случае
# "скачать код проекта -> установить библиотеки -> запустить python main.py".
#
# Важная особенность: каждый запуск происходит на ЧИСТОЙ виртуальной
# машине (никаких следов от прошлого запуска). Чтобы бот "помнил", какие
# машины уже публиковал (наша SQLite база data/cars.db), мы в конце
# каждого прогона СОХРАНЯЕМ обновлённый файл базы обратно в репозиторий
# (см. шаг "Сохранить базу данных" ниже) — тогда следующий запуск скачает
# уже обновлённую версию и продолжит с того же места.
#
# Подробная инструкция по настройке — в файле SETUP_GITHUB_ACTIONS.md
# ═══════════════════════════════════════════════════════════════════

name: Auto Dealer Bot

on:
  # Расписание возобновлено 2026-07-06 после аудита стабилизации (см.
  # FINAL_STATE.md) — main.py переведён на тот же новый формат постов
  # (price_alert_builder.py/lead_post_builder.py), orchestrator.py
  # архивирован, порядок в путях публикации наведён.
  schedule:
    # "0 */6 * * *" — в 00:00, 06:00, 12:00, 18:00 по UTC (у Казани UTC+3,
    # прибавляй 3 часа мысленно, чтобы понять "по-нашему").
    - cron: "0 */6 * * *"

  # Ручной запуск остаётся доступен — вкладка "Actions" -> "Auto Dealer Bot"
  # -> "Run workflow".
  workflow_dispatch:

# Разрешение для этого workflow — писать изменения обратно в репозиторий
# (нужно, чтобы сохранить обновлённую базу данных и лог после прогона).
permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest  # виртуальная машина с Linux (бесплатно для обычных репозиториев)

    steps:
      # Шаг 1: скачиваем код проекта (включая ПРЕДЫДУЩУЮ версию базы данных)
      - name: Скачать код проекта
        uses: actions/checkout@v4

      # Шаг 2: устанавливаем Python
      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Шаг 3: устанавливаем библиотеки проекта
      - name: Установить зависимости
        run: pip install -r requirements.txt

      # Шаг 4: запускаем самого бота.
      # Секретные настройки (токен и т.д.) НЕ хранятся в этом файле —
      # они лежат в "GitHub Secrets" (настраиваются отдельно в репозитории,
      # см. SETUP_GITHUB_ACTIONS.md) и подставляются сюда автоматически.
      - name: Запустить бота
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          LOGISTICS_RUB: ${{ secrets.LOGISTICS_RUB }}
          BROKER_FEE_RUB: ${{ secrets.BROKER_FEE_RUB }}
          MARGIN_RUB: ${{ secrets.MARGIN_RUB }}
          IMPORTER_TYPE: ${{ secrets.IMPORTER_TYPE }}
          # VK — второй канал публикации (vk_publisher.py), см. main_pipeline.yml.
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_OWNER_ID: ${{ secrets.VK_OWNER_ID }}
          DATABASE_PATH: data/cars.db
          LOG_FILE_PATH: logs/app.log
        run: python main.py

      # Шаг 5: сохраняем обновлённую базу данных и лог обратно в репозиторий,
      # чтобы следующий прогон "помнил", что уже публиковалось.
      - name: Сохранить базу данных
        if: always()  # выполняется, даже если предыдущий шаг завершился с ошибкой —
                       # лог всё равно полезно сохранить, чтобы понять, что случилось
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cars.db logs/app.log
          git diff --staged --quiet || git commit -m "Автообновление базы данных [skip ci]"
          git push
