# ═══════════════════════════════════════════════════════════════════
# GitHub Actions workflow — запускает main.py АВТОМАТИЧЕСКИ, на серверах
# GitHub, даже когда твой компьютер выключен.
#
# Как это работает "на пальцах":
# GitHub предоставляет бесплатные виртуальные машины, на которых можно
# по расписанию (или вручную) запускать любые команды — в нашем случае
# "скачать код проекта -> установить библиотеки -> запустить python main.py".
#
# Важная особенность: каждый запуск происходит на ЧИСТОЙ виртуальной
# машине (никаких следов от прошлого запуска). Чтобы бот "помнил", какие
# машины уже публиковал (наша SQLite база data/cars.db), мы в конце
# каждого прогона СОХРАНЯЕМ обновлённый файл базы обратно в репозиторий
# (см. шаг "Сохранить базу данных" ниже) — тогда следующий запуск скачает
# уже обновлённую версию и продолжит с того же места.
#
# Подробная инструкция по настройке — в файле SETUP_GITHUB_ACTIONS.md
# ═══════════════════════════════════════════════════════════════════

name: Auto Dealer Bot

on:
  # Расписание возобновлено 2026-07-06 после аудита стабилизации (см.
  # FINAL_STATE.md) — main.py переведён на тот же новый формат постов
  # (price_alert_builder.py/lead_post_builder.py), orchestrator.py
  # архивирован, порядок в путях публикации наведён.
  schedule:
    # "0 */6 * * *" — в 00:00, 06:00, 12:00, 18:00 по UTC (у Казани UTC+3,
    # прибавляй 3 часа мысленно, чтобы понять "по-нашему").
    - cron: "0 */6 * * *"

  # Ручной запуск остаётся доступен — вкладка "Actions" -> "Auto Dealer Bot"
  # -> "Run workflow".
  workflow_dispatch:
    inputs:
      test_post:
        description: >-
          Вместо обычного прогона по WATCHLIST — принудительно опубликовать
          ОДИН тестовый пост (с фото) в Telegram И VK, игнорируя
          дедупликацию (см. test_post.py). Для проверки каналов "в бою",
          например после смены VK-токена.
        type: boolean
        default: false
      test_video:
        description: >-
          Только вместе с test_post=true: тестовый пост дополнительно
          собирает и публикует ролик с озвучкой (VIDEO_ENABLED/VOICE_ENABLED
          на время ЭТОГО прогона) — нужно, чтобы проверить VK-видеозагрузку
          на сети GitHub Actions (локально уперлись в connect timeout к
          ovu.mycdn.me — см. FINAL_STATE.md/аудит 2026-07-17). Требует
          секрет ANTHROPIC_API_KEY для текста озвучки (см. SETUP_GITHUB_ACTIONS.md).
        type: boolean
        default: false

# Разрешение для этого workflow — писать изменения обратно в репозиторий
# (нужно, чтобы сохранить обновлённую базу данных и лог после прогона).
permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest  # виртуальная машина с Linux (бесплатно для обычных репозиториев)

    steps:
      # Шаг 1: скачиваем код проекта (включая ПРЕДЫДУЩУЮ версию базы данных)
      - name: Скачать код проекта
        uses: actions/checkout@v4

      # Шаг 2: устанавливаем Python
      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Шаг 3: устанавливаем библиотеки проекта
      - name: Установить зависимости
        run: pip install -r requirements.txt

      # ffmpeg — для video_generator.py (см. main_pipeline.yml — тот же
      # шаг). Нужен здесь ради шага "Тестовая публикация" (test_post.py) —
      # обычный прогон main.py (WATCHLIST/price-alert посты) видео не
      # генерирует вообще (см. agent_publisher.publish_post(): видео
      # только там, где вызывающий код явно передаёт fields — main.py
      # этого не делает, другой класс постов).
      - name: Установить ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      # Шаг 4: запускаем самого бота (обычный прогон по WATCHLIST).
      # Секретные настройки (токен и т.д.) НЕ хранятся в этом файле —
      # они лежат в "GitHub Secrets" (настраиваются отдельно в репозитории,
      # см. SETUP_GITHUB_ACTIONS.md) и подставляются сюда автоматически.
      - name: Запустить бота
        if: ${{ github.event.inputs.test_post != 'true' }}
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          LOGISTICS_RUB: ${{ secrets.LOGISTICS_RUB }}
          BROKER_FEE_RUB: ${{ secrets.BROKER_FEE_RUB }}
          MARGIN_RUB: ${{ secrets.MARGIN_RUB }}
          IMPORTER_TYPE: ${{ secrets.IMPORTER_TYPE }}
          # VK — второй канал публикации (vk_publisher.py), см. main_pipeline.yml.
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_OWNER_ID: ${{ secrets.VK_OWNER_ID }}
          DATABASE_PATH: data/cars.db
          LOG_FILE_PATH: logs/app.log
        run: python main.py

      # Шаг 4-тест: включается ТОЛЬКО ручным запуском с галочкой test_post
      # (см. workflow_dispatch.inputs выше) — вместо обычного прогона,
      # публикует один тестовый пост (с фото, префикс "[ТЕСТ] ") сразу в
      # оба канала, игнорируя дедупликацию. См. test_post.py.
      - name: Тестовая публикация (test_post=true)
        if: ${{ github.event.inputs.test_post == 'true' }}
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_OWNER_ID: ${{ secrets.VK_OWNER_ID }}
          # Claude API — для текста озвучки (tts_generator.py), нужен
          # только если test_video=true (без ключа TTS просто пропускает
          # голос с warning в лог, не ломает ролик, см. tts_generator.py).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Видео/озвучка — включаются галочкой test_video при ручном
          # запуске (см. workflow_dispatch.inputs выше), по умолчанию
          # выключены. VIDEO_EVERY_N_POSTS=1 здесь специально (не 3, как в
          # основном прогоне) — тестовая публикация всегда ровно одна,
          # счётчик должен сработать гарантированно на ней же.
          VIDEO_ENABLED: ${{ github.event.inputs.test_video }}
          VOICE_ENABLED: ${{ github.event.inputs.test_video }}
          VIDEO_EVERY_N_POSTS: "1"
          VIDEO_POST_MODE: "same"
        run: python test_post.py

      # Шаг 4.5: как и в main_pipeline.yml — если гейт validate_post_before_publish
      # (post_validator.py) кого-то отклонил в ЭТОМ прогоне, явно фейлим job.
      # Пропускается в режиме test_post — там отказ гейта одному из
      # перебираемых кандидатов ожидаем и не является поломкой (см. test_post.py).
      - name: Проверить rejected_posts.log (гейт validate_post_before_publish)
        if: ${{ always() && github.event.inputs.test_post != 'true' }}
        run: |
          if [ -s rejected_posts.log ]; then
            echo "::error::validate_post_before_publish() отклонил пост(ы) в этом прогоне:"
            cat rejected_posts.log
            exit 1
          fi
          echo "rejected_posts.log пуст — гейт ничего не отклонил в этом прогоне"

      # Шаг 5: сохраняем обновлённую базу данных и лог обратно в репозиторий,
      # чтобы следующий прогон "помнил", что уже публиковалось.
      - name: Сохранить базу данных
        if: always()  # выполняется, даже если предыдущий шаг завершился с ошибкой —
                       # лог всё равно полезно сохранить, чтобы понять, что случилось
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cars.db logs/app.log video_state.json
          git diff --staged --quiet || git commit -m "Автообновление базы данных [skip ci]"
          git push
