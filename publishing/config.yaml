# Публикация и статистика статей (publish.py / stats.py / report.py)
telegram_channel: "-1004357171081"     # КУДА публикуется пост; пусто = переменная TELEGRAM_CHANNEL из .env; иначе "@канал" или числовой id
promo_channel: "@auto_generals"   # канал, на который ведёт именная пригласительная ссылка в блоке «Как заказать»
notify_chat_id: "1216251219"   # личный чат с ботом: уведомления автоодобрения (id чата не секрет)

schedule:                # публикация только в эти дни и не раньше этого времени, не больше 1 статьи в день
  days: [mon, wed, fri]
  time: "10:00"
  timezone: Europe/Moscow

metrika:
  counter_id: 98788601
  utm_source: dzen

auto_approve:                 # publishing/auto_approve.py
  window_hours: 24            # окно отмены: «опубликовать после» = сейчас + это число часов
  max_per_7_days: 1           # не больше столько автоматических статей за 7 дней
  rates_max_age_days: 90      # дата актуальности ставок в customs_rates.py не старше
  allowed_slugs: [utilsbor]   # автоодобрение только для этих тем; остальные — ручная проверка + уведомление
  article_min:                # нижняя граница объёма article.md по slug (по умолчанию 6000)
    utilsbor: 4000

generate_model: claude-opus-5-5     # модель для generate_draft.py (прямой запрос к Anthropic API)
generate_max_tokens: 16000          # потолок ответа (вместе с мышлением модели); не ниже ~12000 для статьи 6–9 тыс. знаков
