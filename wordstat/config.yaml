# Конфиг сбора запросов Яндекс Вордстата (отдельно от корневого config.yaml — тот для car-report)
seeds:
  - авто из Кореи под заказ
  - авто из Китая под заказ
  - растаможка авто
  - утильсбор 2026
  - пригнать авто из Кореи
  - Changan
  - hyundai из кореи
  - kia из кореи

regions: []          # [] = любой регион; иначе строковые id регионов, например ["102"]
devices: [DEVICE_ALL]   # DEVICE_ALL | DEVICE_DESKTOP | DEVICE_PHONE | DEVICE_TABLET
num_phrases: 50      # сколько запросов на затравку (1–2000)

hourly_limit: 100     # лимит Wordstat: запросов в час (и 10 в секунду)
hourly_reserve: 5     # остановиться, не дойдя до лимита на столько запросов
retry_pause_sec: 5        # базовая пауза при 429 (растёт вдвое с каждой попыткой)
max_retries: 4
output: queries.csv

topics:                  # отбор тем (topics_analysis.py topics)
  max_topics: 15
  min_main_freq: 200     # тема отбрасывается, если главный запрос реже (запросов в месяц)
  # Белый список: слово подходит при точном совпадении; корень со звёздочкой (авто*) — любое слово, начинающееся с него
  # (склонения). Фраза с пробелом ("под заказ") ищется как подстрока.
  whitelist: [авто, "автомобил*", "машин*", "япони*", "растаможк*", "утильсбор*", "пригна*",
              "под заказ", "ввоз*", "импорт*", changan, "чанган*", hyundai, хендай, хёндэ, kia, киа]
  # Гео-слова проходят в тему только вместе со словом из auto_context
  geo_words: [корея, кореи, корее, корею, кореей, "корейск*", китай, китая, китае, китаю, китаем, "китайск*"]
  auto_context: ["авто*", "автомобил*", "машин*", "под заказ", "пригна*", "ввоз*", "привез*", "растаможк*", "утильсбор*"]
  auto_context_with_brand: ["из кореи", "из китая"]   # считаются контекстом только вместе с маркой
  customs_roots: ["таможн*", "таможен*"]   # проходит ТОЛЬКО вместе с одним из слов ниже (корни, начало слова)
  customs_requires: [авто, машин, ввоз, ставк, пошлин, калькулятор]
  use_model_specs_brands: true   # плюс марки из model_specs.py
  stopwords: [мобилизац, голые, ххх, xxx, имена, группа, певец, сериал, дорам, язык, алфавит, переводчик, перевод, учить, курсы, косметик, еда, имя]   # слово-начало: выкидывает запрос всегда
  aliases:                       # синонимы бренда: слово слева — каноническое, запросы с ним и его синонимами — одна тема
    changan: [чанган юни, чанган]
    kia: [киа]
    hyundai: [хендай, хёндэ]
  tails:                         # колонка «хвосты» в topics.csv
    min_freq: 200
    max_freq: 5000
    max_count: 5
    words: ["цен*", "купит*", "под заказ", "из китая", "из кореи"]
